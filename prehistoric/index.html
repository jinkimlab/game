<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>원시인 대모험 — 고인돌풍 게임</title><style>
*{box-sizing:border-box}body{margin:0;background:#131923;color:#f7efe1;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{width:min(100%,1000px);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(19px,3vw,28px);margin:0}.hint{font-size:12px;color:#b8cad5}#frame{position:relative;width:min(100vw,1000px);aspect-ratio:16/9;overflow:hidden;border:3px solid #8f6140;border-radius:10px;box-shadow:0 12px 35px #0008;background:#85d6ec}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#overlay{position:absolute;inset:0;background:#101c2dba;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}#overlay.hidden{display:none}.panel{background:#17273de8;border:3px solid #dfae66;border-radius:16px;padding:22px;max-width:420px}.panel h2{margin:0 0 8px;font-size:30px}.panel p{line-height:1.55}button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:#f7c35f;color:#30251a;font-weight:800;cursor:pointer;touch-action:none}button:active{transform:scale(.95)}#controls{width:min(100%,1000px);display:flex;align-items:center;justify-content:space-between;padding:15px;gap:12px}.group{display:flex;gap:10px}.control{min-width:65px;min-height:58px;font-size:20px;background:#344960;color:white;border:2px solid #647b94;user-select:none}.action{background:#d38d50;border-color:#f5c677;color:#27180d}#instructions{max-width:1000px;padding:0 15px 20px;line-height:1.5;color:#c6cfd9;text-align:center;font-size:14px}@media (pointer:fine){#controls{opacity:.75}}
</style></head><body><header><h1>🦴 원시인 대모험</h1><span class="hint">오리지널 고인돌풍 액션 게임</span></header><div id="frame"><canvas id="game" width="960" height="540" aria-label="원시인 횡스크롤 게임"></canvas><div id="overlay"><div class="panel"><h2 id="overlayTitle">🦴 원시인 대모험</h2><p id="overlayDesc">과일을 모으고, 몽둥이로 적을 물리치며 동굴까지 이동하세요!<br>방향키 / A·D 이동 · 스페이스 점프 · X 공격</p><button id="startBtn">게임 시작 ▶</button></div></div></div><div id="controls"><div class="group"><button class="control" data-key="left">◀</button><button class="control" data-key="right">▶</button></div><div class="group"><button class="control action" data-key="jump">⬆ 점프</button><button class="control action" data-key="attack">🦴 공격</button></div></div><div id="instructions">PC: ← → 또는 A D 이동 · ↑ / 스페이스 점프 · X / J 몽둥이 공격 · P 일시정지 · R 재시작<br>휴대폰: 아래 버튼으로 조작 · 전 스테이지의 과일을 반드시 먹을 필요는 없습니다.</div><script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=960,H=540;const overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),desc=document.getElementById('overlayDesc'),start=document.getElementById('startBtn');const keys={left:false,right:false,jump:false,attack:false};let state='menu',level=0,score=0,lives=3,world,player,camera=0,tick=0,inv=0,attackTime=0,attackCooldown=0,jumpLatch=false,attackLatch=false,anim=0,particles=[];let ac;
function sound(freq=440,dur=.09,type='square',vol=.035){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(65,freq*.65),ac.currentTime+dur);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
const LEVELS=[{length:2900,ground:442,gaps:[[650,785],[1670,1815]],platforms:[[300,355,160],[870,348,185],[1270,330,155],[1950,358,170],[2380,328,220]],enemies:[380,900,1130,1470,1930,2200,2560],fruit:[200,340,465,880,970,1275,1350,1530,1940,2040,2380,2500,2720]}, {length:3550,ground:442,gaps:[[550,705],[1220,1400],[2410,2590]],platforms:[[300,360,160],[750,326,200],[1050,365,160],[1470,345,220],[1870,315,190],[2260,358,130],[2670,323,210],[3100,355,180]],enemies:[310,790,1020,1540,1750,2070,2270,2710,3000,3300],fruit:[180,330,750,830,1060,1500,1610,1880,1960,2260,2680,2750,3100,3210,3410]}, {length:4000,ground:442,gaps:[[720,905],[1650,1830],[2800,2980]],platforms:[[330,350,180],[935,343,210],[1320,315,165],[1890,350,190],[2300,327,205],[3030,335,220],[3460,307,175]],enemies:[350,530,990,1190,1450,1940,2160,2360,2600,3070,3330,3570,3780],fruit:[170,330,430,955,1060,1340,1420,1890,1990,2310,2420,3070,3140,3470,3560,3790]}];
function groundAt(x){return !world.gaps.some(g=>x>g[0]&&x<g[1]);}
function build(n){level=n;const d=LEVELS[n];world={...d, platforms:d.platforms.map(p=>({x:p[0],y:p[1],w:p[2],h:18})),enemies:d.enemies.map((x,i)=>({x,y:d.ground-33,w:37,h:33,dir:i%2?1:-1,alive:true,vy:0,base:x,t:Math.random()*90})),fruit:d.fruit.map((x,i)=>({x,y:i%3===0?d.ground-105:d.ground-45,got:false})),goal:d.length-155};player={x:75,y:280,w:37,h:54,vx:0,vy:0,face:1,onGround:false};camera=0;inv=70;attackTime=0;attackCooldown=0;particles=[];}
function show(t,d,b){title.textContent=t;desc.innerHTML=d;start.textContent=b;overlay.classList.remove('hidden');}function hide(){overlay.classList.add('hidden')};function newGame(){score=0;lives=3;build(0);state='play';hide()};function loseLife(){if(inv>0)return;lives--;sound(145,.26,'sawtooth',.07);burst(player.x+17,player.y+24,'#ff9d82',14);if(lives<=0){state='over';show('게임 오버 ☠️',`점수: ${score.toLocaleString()}점<br>다시 도전해 보세요!`,'다시 시작 ↻')}else{player.x=Math.max(75,Math.floor(player.x/750)*750+75);if(!groundAt(player.x+15))player.x=75;player.y=250;player.vx=player.vy=0;inv=100;}}function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.7)*8,life:25+Math.random()*15,color})}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){tick++;if(state!=='play')return;anim++;let move=(keys.right?1:0)-(keys.left?1:0);player.vx=move*4.5;if(move)player.face=move;if(keys.jump&&!jumpLatch&&player.onGround){player.vy=-12.8;player.onGround=false;sound(340,.12)}jumpLatch=keys.jump;if(keys.attack&&!attackLatch&&attackCooldown===0){attackTime=15;attackCooldown=24;sound(190,.12,'triangle')};attackLatch=keys.attack;if(attackTime)attackTime--;if(attackCooldown)attackCooldown--;if(inv)inv--;
const prevBottom=player.y+player.h;player.x=Math.max(0,Math.min(world.length-player.w,player.x+player.vx));player.vy=Math.min(14,player.vy+.57);player.y+=player.vy;player.onGround=false;if(player.vy>=0){if(groundAt(player.x+7)&&groundAt(player.x+player.w-7)&&prevBottom<=world.ground+9&&player.y+player.h>=world.ground){player.y=world.ground-player.h;player.vy=0;player.onGround=true}for(const p of world.platforms){if(player.x+player.w>p.x+6&&player.x<p.x+p.w-6&&prevBottom<=p.y+8&&player.y+player.h>=p.y&&player.y+player.h<p.y+27){player.y=p.y-player.h;player.vy=0;player.onGround=true}}}if(player.y>H+80){inv=0;loseLife();}
for(const f of world.fruit){if(f.got)continue;const dx=player.x+20-f.x,dy=player.y+22-f.y;if(dx*dx+dy*dy<35*35){f.got=true;score+=100;burst(f.x,f.y,'#ffe16d',7);sound(700,.08,'sine')}}
for(const e of world.enemies){if(!e.alive)continue;e.t++;const next=e.x+e.dir*(1.05+level*.22);if(Math.abs(next-e.base)>68||!groundAt(next+e.w/2))e.dir*=-1;else e.x=next;e.y=world.ground-e.h;const hit={x:player.face>0?player.x+29:player.x-45,y:player.y+13,w:55,h:32};if(attackTime>=6&&overlap(hit,e)){e.alive=false;score+=200;burst(e.x+18,e.y+18,'#bd8dd3',13);sound(240,.13);continue}if(overlap(player,e)&&inv===0){if(player.vy>2&&player.y+player.h-9<e.y+14){e.alive=false;player.vy=-8;score+=150;burst(e.x,e.y,'#ca93e6',10);sound(500,.1)}else loseLife()}}
if(player.x+player.w>world.goal){score+=500;if(level===LEVELS.length-1){state='win';show('🎉 대모험 성공!',`모든 3개 스테이지 클리어!<br>최종 점수: ${score.toLocaleString()}점`,'다시 플레이 ↻');sound(790,.45,'sine')}else{build(level+1);state='between';show(`스테이지 ${level+1} 도착!`,`점수: ${score.toLocaleString()}점 · 남은 목숨: ${lives}<br>다음 동굴을 향해 출발하세요!`,'다음 스테이지 ▶')}}camera+=(Math.max(0,Math.min(world.length-W,player.x-W*.32))-camera)*.14;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life--}particles=particles.filter(p=>p.life>0);
}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function draw(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,level===2?'#76b8d3':'#79c9e9');sky.addColorStop(1,'#d5efd0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ellipse(790-camera*.04,95,44,44,'#ffe6a0');for(let i=0;i<12;i++){const x=((i*207-camera*.11)%(W+330)+W+330)%(W+330)-100;ellipse(x,110+(i%4)*30,65,22,'#e8f5e9');ellipse(x+42,105+(i%4)*30,45,19,'#e8f5e9')}
for(let i=0;i<19;i++){let x=i*215-camera*.22;ctx.fillStyle=i%2?'#78a893':'#83b19b';ctx.beginPath();ctx.moveTo(x-190,world.ground);ctx.lineTo(x+35,220+(i%3)*38);ctx.lineTo(x+240,world.ground);ctx.fill()}
ctx.save();ctx.translate(-camera,0);for(let x=0;x<world.length;x+=32){if(!groundAt(x+16))continue;rect(x,world.ground,32,H-world.ground,'#98623c');rect(x,world.ground,32,14,'#62a653');rect(x,world.ground+14,32,9,'#6eaa49');rect(x+9,world.ground+31,8,5,'#c28c55');rect(x+22,world.ground+57,6,4,'#73492c')}
for(const p of world.platforms){rect(p.x,p.y,p.w,p.h,'#987059');rect(p.x,p.y,p.w,7,'#8bc366');for(let x=p.x+12;x<p.x+p.w;x+=38)rect(x,p.y+10,18,3,'#b38f6b')}
for(let x=120;x<world.length;x+=260){if(!groundAt(x))continue;rect(x+10,world.ground-38,8,39,'#81543b');ellipse(x+14,world.ground-60,27,31,'#399c67');ellipse(x-2,world.ground-52,19,24,'#47ab70');ellipse(x+27,world.ground-45,15,21,'#31865b')}
for(const f of world.fruit)if(!f.got){let bob=Math.sin(tick*.075+f.x)*3;ellipse(f.x,f.y+bob,11,12,'#ffab38');ellipse(f.x-3,f.y+bob-3,3,4,'#ffe58d');rect(f.x,f.y+bob-15,3,5,'#497f33')}
for(const e of world.enemies)if(e.alive){ellipse(e.x+19,e.y+21,18,14,'#8252a3');ellipse(e.x+12,e.y+10,12,10,'#9c72bc');ellipse(e.x+28,e.y+10,12,10,'#9c72bc');ellipse(e.x+12,e.y+20,4,5,'white');ellipse(e.x+27,e.y+20,4,5,'white');ellipse(e.x+12+e.dir*1.5,e.y+20,2,3,'#27213b');ellipse(e.x+27+e.dir*1.5,e.y+20,2,3,'#27213b');rect(e.x+7,e.y+31,7,4,'#64387c');rect(e.x+25,e.y+31,7,4,'#64387c')}
// Cave gate
rect(world.goal+25,world.ground-105,72,105,'#756356');ellipse(world.goal+61,world.ground-104,52,30,'#756356');rect(world.goal+43,world.ground-86,38,86,'#272933');ellipse(world.goal+62,world.ground-85,19,19,'#272933');rect(world.goal+52,world.ground-113,18,7,'#ffdf8c');
if(!(inv&&Math.floor(tick/5)%2===0)){let x=player.x,y=player.y;ellipse(x+18,y+15,16,17,'#edb47e');ellipse(x+15,y+8,17,9,'#70452c');rect(x+5,y+3,19,7,'#70452c');ellipse(x+(player.face===1?26:9),y+16,3,3,'#2c2219');ellipse(x+19,y+29,17,8,'#b55c32');rect(x+8,y+31,24,13,'#a4512c');rect(x+7,y+40,9,13,'#e9a56a');rect(x+24,y+40,9,13,'#e9a56a');rect(x+5,y+25,7,13,'#edae78');rect(x+30,y+25,7,13,'#edae78');if(attackTime>0){ctx.save();ctx.translate(x+(player.face===1?34:3),y+18);ctx.rotate((player.face===1?1:-1)*(-.7+attackTime*.12));rect(0,-5,43,10,'#86542e');ellipse(42,0,15,9,'#9e7145');ctx.restore()}else{rect(x+(player.face===1?31:-12),y+23,26,7,'#82552f');ellipse(x+(player.face===1?58:-12),y+26,10,8,'#a37d4e')}}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/18);rect(p.x,p.y,5,5,p.color)}ctx.globalAlpha=1;ctx.restore();rect(0,0,W,52,'#142335c9');ctx.fillStyle='#fff2c9';ctx.font='bold 22px system-ui';ctx.fillText(`🦴 STAGE ${level+1}/3`,20,33);ctx.fillText(`🍎 ${score.toLocaleString()}`,235,33);ctx.fillText(`❤️ ${lives}`,440,33);ctx.fillText(`🏁 ${Math.min(100,Math.round(player.x/world.length*100))}%`,575,33);ctx.font='16px system-ui';ctx.fillText('P 일시정지',822,33);if(state==='paused'){rect(0,52,W,H-52,'#10192990');ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 39px system-ui';ctx.fillText('일시정지',W/2,H/2);ctx.textAlign='start'}requestAnimationFrame(loop)}let last=0,acc=0;function loop(t){if(!last)last=t;acc+=Math.min(50,t-last);last=t;while(acc>=1000/60){update();acc-=1000/60}drawFrameOnly()}function drawFrameOnly(){drawScene()} // assigned below
let drawScene=draw; // render callback without calling requestAnimationFrame recursively
// replace draw's internal scheduling: draw is invoked once per loop; schedule only loop
const render=draw;drawScene=()=>{render()};
function keyFrom(k){k=k.toLowerCase();if(['arrowleft','a'].includes(k))return'left';if(['arrowright','d'].includes(k))return'right';if(['arrowup','w',' '].includes(k))return'jump';if(['x','j','control'].includes(k))return'attack';return null}
window.addEventListener('keydown',e=>{let k=keyFrom(e.key);if(k){e.preventDefault();keys[k]=true}if(e.key.toLowerCase()==='p'&&!e.repeat&&(state==='play'||state==='paused')){state=state==='paused'?'play':'paused';if(state==='paused')show('⏸ 일시정지','게임을 계속하려면 P 또는 아래 버튼을 누르세요.','계속하기 ▶');else hide()}if(e.key.toLowerCase()==='r'&&!e.repeat)newGame()});window.addEventListener('keyup',e=>{let k=keyFrom(e.key);if(k){e.preventDefault();keys[k]=false}});window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();keys[k]=true;btn.setPointerCapture?.(e.pointerId)};const up=e=>{e.preventDefault();keys[k]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)});start.onclick=()=>{if(state==='paused'){state='play';hide()}else if(state==='between'){state='play';hide()}else newGame()};build(0); // The frame rate loop is driven by a single requestAnimationFrame chain.
// Reconfigure rendering callback to avoid duplicate scheduling from draw.
const originalDraw=draw;drawScene=()=>originalDraw();
// single animation loop: originalDraw schedules the next requestAnimationFrame(loop)
requestAnimationFrame(loop);
})();</script></body></html>
