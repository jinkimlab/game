<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RETRO SOCCER 1988 | Arcade Football</title>
<style>
:root{color-scheme:dark;--gold:#ffe064;--ink:#071728}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c3b54,#080e1c 75%);font-family:system-ui,'Malgun Gothic',sans-serif;color:white;min-height:100vh}main{max-width:1100px;margin:auto;padding:18px 16px 30px}.title{text-align:center;font-size:clamp(23px,4vw,43px);font-weight:1000;letter-spacing:3px;color:var(--gold);text-shadow:4px 4px #bc4c4c;margin:6px 0}.subtitle{text-align:center;letter-spacing:2px;color:#b9d8dc;font-size:12px;margin-bottom:14px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#102338;border:3px solid #46617b;border-radius:12px;padding:10px 16px;margin:10px auto;font-weight:900}.team{display:flex;align-items:center;gap:9px;font-size:clamp(12px,2.5vw,20px)}.swatch{width:16px;height:16px;border-radius:3px;background:#30abff;box-shadow:0 0 8px #30abff}.swatch.red{background:#ff6076;box-shadow:0 0 8px #ff6076}.score{font-size:clamp(24px,4vw,38px);font-variant-numeric:tabular-nums;color:var(--gold)}.clock{font-size:clamp(14px,2vw,23px);font-variant-numeric:tabular-nums}.game{position:relative;border:5px solid #334f62;border-radius:12px;box-shadow:0 15px 45px #0009;overflow:hidden;background:#166e40}canvas{display:block;width:100%;height:auto;aspect-ratio:1000/620;touch-action:none}.overlay{position:absolute;inset:0;background:#061321dd;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;padding:20px;gap:13px}.overlay.hidden{display:none}.overlay h2{font-size:clamp(23px,4vw,42px);color:var(--gold);margin:0;text-shadow:2px 3px #000}.overlay p{margin:0;line-height:1.7;color:#d7eafa}.action{background:var(--gold);border:0;color:#16273b;font-size:17px;font-weight:1000;padding:13px 28px;border-radius:8px;cursor:pointer;box-shadow:0 5px #a98b36}.action:active{transform:translateY(3px);box-shadow:0 2px #a98b36}.info{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;color:#d5e6f0}.info strong{color:var(--gold)}.controls{margin-top:12px;background:#15283a;border-radius:10px;padding:13px;line-height:1.9;font-size:14px}.key{display:inline-block;background:#314b62;border:1px solid #7891a0;border-bottom-width:3px;border-radius:5px;padding:1px 8px;color:#fff;font-weight:800;margin:0 3px}.touch{display:none;justify-content:space-between;align-items:end;margin-top:15px;gap:10px;user-select:none}.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,45px);gap:3px}.touch button{border:2px solid #637d8b;background:#243f56;color:white;border-radius:12px;font-weight:1000;font-size:19px;touch-action:none;user-select:none;cursor:pointer}.dpad [data-key=ArrowUp]{grid-area:1/2}.dpad [data-key=ArrowLeft]{grid-area:2/1}.dpad [data-key=ArrowDown]{grid-area:3/2}.dpad [data-key=ArrowRight]{grid-area:2/3}.touch-actions{display:flex;gap:10px}.touch-actions button{width:76px;height:76px;border-radius:50%;background:#bd4959}.touch-actions button:first-child{background:#3178af}@media(pointer:coarse),(max-width:700px){.touch{display:flex}.controls{font-size:12px}.top{padding:8px}.team{gap:4px}}@media(max-width:420px){.dpad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,38px)}.touch-actions button{width:62px;height:62px;font-size:14px}}
</style>
</head>
<body><main>
<h1 class="title">⚽ RETRO SOCCER '88</h1><div class="subtitle">PIXEL-STYLE ARCADE FOOTBALL · BLUE VS RED</div>
<div class="top"><div class="team"><i class="swatch"></i> BLUE <span id="blueScore" class="score">0</span></div><div class="clock" id="clock">02:00</div><div class="team"><span id="redScore" class="score">0</span> RED <i class="swatch red"></i></div></div>
<div class="game"><canvas id="pitch" width="1000" height="620" aria-label="축구게임 필드"></canvas><div class="overlay" id="overlay"><h2 id="overlayTitle">RETRO SOCCER '88</h2><p id="overlayText">파란 팀을 조종해서 빨간 팀을 이기세요!<br>방향키 이동 · Z 패스/선수 변경 · X 슛 · P 일시정지</p><button class="action" id="start">경기 시작 ▶</button></div></div>
<div class="info"><span id="status"><strong>준비 완료</strong> · 2분 경기</span><button class="action" id="restart" style="font-size:13px;padding:8px 15px">↻ 새 경기</button></div>
<div class="controls">🎮 <b>조작법</b> &nbsp;<span class="key">↑ ↓ ← →</span> 이동 &nbsp;<span class="key">Z</span> 패스 / 공 없을 때 선수 변경 &nbsp;<span class="key">X</span> 슛 / 태클 &nbsp;<span class="key">P</span> 일시정지<br>💡 공을 가진 선수는 하얀 테두리로 표시됩니다. 공격 방향은 <b>오른쪽 →</b> 입니다. 모바일에서는 아래 버튼을 사용하세요.</div>
<div class="touch"><div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button><button data-key="ArrowDown">▼</button></div><div class="touch-actions"><button data-key="KeyZ">패스</button><button data-key="KeyX">슛</button></div></div>
</main>
<script>
(()=>{'use strict';
const c=document.getElementById('pitch'),ctx=c.getContext('2d'),W=1000,H=620;
const $=id=>document.getElementById(id), keys=new Set(), FX=38,FY=50,FW=924,FH=520,GOALTOP=242,GOALBOTTOM=378;
let blue=[],red=[],ball,scoreB=0,scoreR=0,remaining=120,running=false,paused=false,selected=0,goalTimer=0,goalMsg='',last=0,clockAccum=0,gameOver=false,kickoffLock=0;
let audioCtx;function beep(freq,duration=.08,type='square',volume=.04){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}catch(e){}}
function player(x,y,team,num,keeper=false){return{x,y,vx:0,vy:0,team,num,keeper,face:team==='B'?1:-1,cd:0}}
function setup(keepScore=false){blue=[player(92,310,'B',1,true),player(280,160,'B',2),player(270,460,'B',3),player(400,260,'B',4),player(400,380,'B',5)];red=[player(908,310,'R',1,true),player(725,160,'R',2),player(730,460,'R',3),player(600,260,'R',4),player(600,380,'R',5)];ball={x:500,y:310,vx:0,vy:0,owner:null,lock:0,lastTeam:null};selected=3;goalTimer=0;goalMsg='';kickoffLock=0.7;if(!keepScore){scoreB=0;scoreR=0;remaining=120;clockAccum=0;gameOver=false}hud()}
function hud(){$('blueScore').textContent=scoreB;$('redScore').textContent=scoreR;$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function overlay(title,text,btn){$('overlayTitle').textContent=title;$('overlayText').innerHTML=text;$('start').textContent=btn;$('overlay').classList.remove('hidden')}
function start(){if(gameOver)setup();running=true;paused=false;gameOver=false;$('overlay').classList.add('hidden');beep(590,.12);last=performance.now()}
$('start').onclick=start;$('restart').onclick=()=>{setup();running=true;paused=false;$('overlay').classList.add('hidden');beep(620,.1)};
function pause(){if(!running||gameOver)return;paused=!paused;if(paused)overlay('일시정지','경기를 계속하려면 아래 버튼 또는 P를 누르세요.','계속하기');else $('overlay').classList.add('hidden')}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(arr,except=null){let best=null,d=Infinity;for(let p of arr){if(p===except)continue;let v=dist(p,ball);if(v<d){d=v;best=p}}return best}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function moveToward(p,x,y,dt,speed){let dx=x-p.x,dy=y-p.y,l=Math.hypot(dx,dy);if(l>3){p.x+=dx/l*Math.min(l,speed*dt);p.y+=dy/l*Math.min(l,speed*dt);p.face=dx>0?1:-1}}
function constrain(p){p.x=clamp(p.x,FX+13,FX+FW-13);p.y=clamp(p.y,FY+13,FY+FH-13);if(p.keeper){p.x=clamp(p.x,p.team==='B'?FX+15:FX+FW-105,p.team==='B'?FX+105:FX+FW-15);p.y=clamp(p.y,GOALTOP-45,GOALBOTTOM+45)}}
function take(p){ball.owner=p;ball.vx=ball.vy=0;ball.lock=.2;ball.lastTeam=p.team;if(p.team==='B')selected=blue.indexOf(p);beep(200,.025,'sine',.014)}
function kick(p,mode){if(!p||ball.owner!==p||p.cd>0||kickoffLock>0)return;let dx,dy,speed;if(mode==='pass'){let mates=(p.team==='B'?blue:red).filter(q=>q!==p&&!q.keeper);mates.sort((a,b)=>dist(a,p)-dist(b,p));let target=mates.find(q=>(q.x-p.x)*(p.team==='B'?1:-1)>20)||mates[0];dx=target.x-p.x;dy=target.y-p.y;speed=490}else{dx=(p.team==='B'?962:38)-p.x;dy=310-p.y+(Math.random()-.5)*110;speed=750}let n=Math.hypot(dx,dy)||1;ball.owner=null;ball.x=p.x+(dx/n)*23;ball.y=p.y+(dy/n)*23;ball.vx=dx/n*speed;ball.vy=dy/n*speed;ball.lock=.26;p.cd=.36;ball.lastTeam=p.team;beep(mode==='shoot'?440:330,.08)}
function tackle(p){p.cd=.4;if(ball.owner&&ball.owner.team!==p.team&&dist(p,ball.owner)<35){take(p);return}if(!ball.owner&&dist(p,ball)<36)take(p)}
function userAction(type){if(!running||paused||goalTimer>0)return;let p=blue[selected];if(ball.owner===p)kick(p,type);else if(type==='pass'){let candidates=blue.filter(q=>!q.keeper);candidates.sort((a,b)=>dist(a,ball)-dist(b,ball));selected=blue.indexOf(candidates[0]===p?(candidates[1]||p):candidates[0]);beep(350,.025)}else tackle(p)}
function ai(dt){const pursB=nearest(blue.filter((p,i)=>i!==selected&&!p.keeper));const pursR=nearest(red.filter(p=>!p.keeper));for(const team of [blue,red])for(let i=0;i<team.length;i++){const p=team[i];if(p.cd>0)p.cd-=dt;if(team===blue&&i===selected)continue;if(p.keeper){let bx=team===blue?FX+35:FX+FW-35;moveToward(p,bx,clamp(ball.y,GOALTOP-42,GOALBOTTOM+42),dt,155);constrain(p);continue}if(ball.owner===p){let dir=team===blue?1:-1,goalX=dir>0?950:50;moveToward(p,p.x+dir*70,clamp(310+(p.y-310)*.78,95,525),dt,135);if((Math.abs(goalX-p.x)<330||Math.random()<dt*.22)&&p.cd<=0)kick(p,'shoot');else if(Math.random()<dt*.45&&p.cd<=0)kick(p,'pass')}
else if((team===blue&&p===pursB&&!ball.owner)||(team===red&&p===pursR&&(!ball.owner||ball.owner.team==='B'))||(ball.owner&&ball.owner.team!==p.team&&dist(p,ball.owner)<160)){const target=ball.owner||ball;moveToward(p,target.x,target.y,dt,team===blue?152:171)}else{let baseX=team===blue?[0,270,270,400,400][i]:[0,725,725,600,600][i],baseY=[310,160,460,260,380][i];let drift=ball.x-500;moveToward(p,baseX+drift*.18,baseY+(ball.y-310)*.12,dt,91)}constrain(p)}}
function physics(dt){if(ball.lock>0)ball.lock-=dt;if(kickoffLock>0)kickoffLock-=dt;const p=blue[selected];let x=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0),y=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);let n=Math.hypot(x,y);if(n){x/=n;y/=n;p.x+=x*218*dt;p.y+=y*218*dt;if(x)p.face=x>0?1:-1}constrain(p);ai(dt);
if(ball.owner){let o=ball.owner;ball.x=o.x+o.face*18;ball.y=o.y;for(const enemy of(o.team==='B'?red:blue)){if(dist(enemy,o)<25&&enemy.cd<=0&&Math.random()<dt*(enemy.keeper?7:2.1)){take(enemy);enemy.cd=.45;break}}}
else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;let f=Math.pow(.985,dt*60);ball.vx*=f;ball.vy*=f;if(ball.y<FY+7){ball.y=FY+7;ball.vy=Math.abs(ball.vy)*.72}if(ball.y>FY+FH-7){ball.y=FY+FH-7;ball.vy=-Math.abs(ball.vy)*.72}
if(ball.x<FX+7||ball.x>FX+FW-7){const atLeft=ball.x<FX+7,inGoal=ball.y>GOALTOP&&ball.y<GOALBOTTOM;if(inGoal){goal(atLeft?'R':'B');return}ball.x=atLeft?FX+7:FX+FW-7;ball.vx*=-.66}
if(ball.lock<=0){let arr=[...blue,...red].sort((a,b)=>dist(a,ball)-dist(b,ball));if(arr.length&&dist(arr[0],ball)<(arr[0].keeper?29:22))take(arr[0])}}
for(let i=0;i<blue.length;i++)for(let j=0;j<red.length;j++){let a=blue[i],b=red[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;if(d<23){let push=(23-d)*.5;a.x+=dx/d*push;b.x-=dx/d*push;a.y+=dy/d*push;b.y-=dy/d*push;constrain(a);constrain(b)}}}
function goal(team){team==='B'?scoreB++:scoreR++;goalMsg=team==='B'?'⚽ GOAL! BLUE SCORES!':'⚽ GOAL! RED SCORES!';goalTimer=2;ball.owner=null;ball.vx=ball.vy=0;hud();beep(660,.18);setTimeout(()=>beep(880,.2),170);$('status').innerHTML='<strong>'+goalMsg+'</strong>'}
function draw(){ctx.fillStyle='#147342';ctx.fillRect(0,0,W,H);for(let i=0;i<11;i++){ctx.fillStyle=i%2?'#187a43':'#21864c';ctx.fillRect(FX+i*FW/11,FY,FW/11,FH)}ctx.fillStyle='#0b4835';ctx.fillRect(0,0,W,FY);ctx.fillRect(0,FY+FH,W,FY);ctx.fillRect(0,FY,FX,FH);ctx.fillRect(FX+FW,FY,FX,FH);
ctx.strokeStyle='#e9f4d9';ctx.lineWidth=3;ctx.strokeRect(FX,FY,FW,FH);ctx.beginPath();ctx.moveTo(500,FY);ctx.lineTo(500,FY+FH);ctx.stroke();ctx.beginPath();ctx.arc(500,310,85,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#e9f4d9';ctx.beginPath();ctx.arc(500,310,5,0,7);ctx.fill();ctx.strokeRect(FX,178,156,264);ctx.strokeRect(FX+FW-156,178,156,264);ctx.strokeRect(FX,239,55,142);ctx.strokeRect(FX+FW-55,239,55,142);ctx.fillStyle='#f9eac0';ctx.fillRect(34,GOALTOP,7,GOALBOTTOM-GOALTOP);ctx.fillRect(959,GOALTOP,7,GOALBOTTOM-GOALTOP);ctx.strokeStyle='#c7d5db88';ctx.lineWidth=2;ctx.strokeRect(9,GOALTOP,29,GOALBOTTOM-GOALTOP);ctx.strokeRect(962,GOALTOP,29,GOALBOTTOM-GOALTOP);ctx.lineWidth=1;for(let yy=GOALTOP;yy<=GOALBOTTOM;yy+=17){ctx.beginPath();ctx.moveTo(9,yy);ctx.lineTo(38,yy);ctx.moveTo(962,yy);ctx.lineTo(991,yy);ctx.stroke()}
for(let team of[blue,red])for(let p of team){const isSelected=team===blue&&blue[selected]===p;ctx.fillStyle='#001e2080';ctx.beginPath();ctx.ellipse(p.x+2,p.y+10,16,8,0,0,7);ctx.fill();if(isSelected){ctx.strokeStyle='#fff474';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,21,0,7);ctx.stroke();ctx.fillStyle='#fff474';ctx.beginPath();ctx.moveTo(p.x-8,p.y-35);ctx.lineTo(p.x+8,p.y-35);ctx.lineTo(p.x,p.y-25);ctx.fill()}ctx.fillStyle=p.team==='B'?'#279bff':'#fa5166';ctx.strokeStyle=p.team==='B'?'#d8f5ff':'#ffd2d9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,14,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(p.num,p.x,p.y+4);if(p.keeper){ctx.fillStyle='#ffe76a';ctx.beginPath();ctx.arc(p.x,p.y-13,5,0,7);ctx.fill()}}
ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(ball.x+3,ball.y+7,10,5,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.strokeStyle='#17232c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#233747';ctx.beginPath();ctx.arc(ball.x,ball.y,3.4,0,7);ctx.fill();if(goalTimer>0){ctx.fillStyle='#07182bcc';ctx.fillRect(275,240,450,118);ctx.fillStyle='#ffe064';ctx.textAlign='center';ctx.font='bold 37px system-ui';ctx.fillText(goalMsg,500,310)}}
function tick(now){let dt=Math.min((now-last)/1000||0,.035);last=now;if(running&&!paused){if(goalTimer>0){goalTimer-=dt;if(goalTimer<=0){setup(true);$('status').innerHTML='<strong>킥오프!</strong> · X 슛, Z 패스'}}else{physics(dt);clockAccum+=dt;if(clockAccum>=1){let sec=Math.floor(clockAccum);clockAccum-=sec;remaining=Math.max(0,remaining-sec);hud();if(remaining===0){running=false;gameOver=true;let result=scoreB>scoreR?'승리! 🏆':scoreB<scoreR?'패배!':'무승부!';overlay('경기 종료 · '+result,`최종 점수 BLUE ${scoreB} : ${scoreR} RED<br>다시 도전해 보세요!`,'다시 경기하기');beep(300,.4)}}}}draw();requestAnimationFrame(tick)}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyZ','KeyX','KeyP','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();if(!keys.has(e.code)){if(e.code==='KeyP'){if(!running&&gameOver)start();else pause()}if(e.code==='KeyZ')userAction('pass');if(e.code==='KeyX'||e.code==='Space')userAction('shoot');if(e.code==='Enter'&&!running)start()}keys.add(e.code)});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!keys.has(k)){if(k==='KeyZ')userAction('pass');if(k==='KeyX')userAction('shoot')}keys.add(k)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))}
setup();requestAnimationFrame(tick);
})();
</script></body></html>
