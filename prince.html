<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>사막 궁전의 모험 | 고전 액션 게임</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101523;color:#f6eacc;font-family:system-ui,'Malgun Gothic',sans-serif;text-align:center}header{padding:13px 10px 7px}h1{font-size:clamp(21px,4vw,30px);margin:3px;color:#ffda7e}p{margin:6px;color:#d3c9b9}.frame{position:relative;width:min(98vw,960px);margin:auto;border:4px solid #ad864e;border-radius:8px;overflow:hidden;background:#1a1523;box-shadow:0 10px 40px #0008}canvas{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:none}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#080b16c7;padding:20px;gap:10px}#overlay.hidden{display:none}#overlay h2{color:#ffe29e;font-size:clamp(20px,5vw,34px);margin:0}#overlay p{max-width:520px;line-height:1.7}button{background:#e0a94c;border:2px solid #fff0c0;border-radius:7px;padding:11px 22px;font-size:16px;font-weight:bold;color:#271b15;cursor:pointer}button:hover{background:#ffd376}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:13px auto;max-width:960px}.controls button{user-select:none;touch-action:none;min-width:65px;padding:12px 15px}small{display:block;padding-bottom:22px;color:#aeb0bc}kbd{background:#33394c;border:1px solid #8d8fa4;border-radius:3px;padding:1px 5px;color:white}
</style></head><body><header><h1>⚔️ 사막 궁전의 모험</h1><p>고전 왕자 액션에서 영감을 얻은 독창적인 웹게임</p></header>
<div class="frame"><canvas id="game" width="960" height="540" aria-label="궁전 액션 게임"></canvas><div id="overlay"><h2 id="overlayTitle">사막 궁전의 모험</h2><p id="overlayText">궁전의 함정을 피해 적을 물리치고 황금 문에 도달하세요!<br>← → 이동 · ↑/Space 점프 · X 검 공격 · ↓ 방어 · P 일시정지</p><button id="start">게임 시작</button></div></div>
<div class="controls"><button data-key="ArrowLeft">◀ 이동</button><button data-key="ArrowRight">이동 ▶</button><button data-key="Space">⬆ 점프</button><button data-key="KeyX">⚔ 공격</button><button data-key="ArrowDown">🛡 방어</button><button id="pause">⏸ 일시정지</button></div><small>PC: <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>↑</kbd>/<kbd>Space</kbd> 점프 · <kbd>X</kbd> 공격 · <kbd>↓</kbd> 방어 · <kbd>P</kbd> 일시정지 · <kbd>R</kbd> 재시작</small>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startButton=document.getElementById('start'),title=document.getElementById('overlayTitle'),message=document.getElementById('overlayText');
const W=960,H=540,GR=468,keys=new Set();let state='menu',level=0,score=0,cam=0,tick=0,last=0,world,player,particles=[],timeLeft=180,clockAcc=0,attackId=0;
let ac=null;function sound(f=440,d=.09,type='square'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,f*.65),ac.currentTime+d);g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}
const layouts=[
 {width:2300,platforms:[[0,570,GR],[650,460,GR],[1190,430,GR],[1710,590,GR],[400,145,352],[840,180,335],[1370,160,349],[1850,155,342]],spikes:[[710,775],[1260,1320],[1920,1990]],guards:[870,1460,1970],coins:[260,455,890,1060,1450,1835,2140],door:2215},
 {width:2700,platforms:[[0,480,GR],[575,390,GR],[1055,540,GR],[1690,360,GR],[2120,580,GR],[225,145,355],[725,125,330],[1250,160,350],[1820,140,335],[2270,150,345]],spikes:[[270,345],[810,880],[1290,1360],[2190,2260]],guards:[340,790,1330,1860,2320],coins:[170,375,790,1070,1350,1730,2120,2410],door:2580},
 {width:3200,platforms:[[0,550,GR],[630,450,GR],[1170,400,GR],[1690,430,GR],[2240,410,GR],[2750,450,GR],[330,150,345],[780,130,320],[1310,150,346],[1900,135,329],[2440,130,333]],spikes:[[240,315],[720,795],[1290,1370],[1800,1875],[2360,2430],[2850,2930]],guards:[450,930,1430,1960,2490,2940],coins:[160,470,820,1110,1430,1700,2000,2290,2570,3030],door:3090}
];
function loadLevel(i){level=i;const b=layouts[i];world={...b,coins:b.coins.map(x=>({x,y:0,taken:false})),guards:b.guards.map(x=>({x,y:GR-48,w:27,h:48,vx:0,dir:-1,hp:i===2?3:2,hit:0,atk:0,attackTag:0,onGround:false,alive:true,patrol:x}))};for(let c of world.coins){let f=world.platforms.find(([x,w])=>c.x>x&&c.x<x+w);c.y=(f?f[2]:GR)-55}for(let g of world.guards){let f=world.platforms.find(([x,w])=>g.x>x&&g.x<x+w);g.y=(f?f[2]:GR)-g.h}player={x:60,y:GR-55,w:29,h:55,vx:0,vy:0,dir:1,hp:5,inv:0,onGround:false,attack:0,attackTag:0,block:false};cam=0;particles=[];clockAcc=0;state='playing';hide();}
function restart(){score=0;timeLeft=180;loadLevel(0)}function show(t,m,btn){title.textContent=t;message.innerHTML=m;startButton.textContent=btn;overlay.classList.remove('hidden')}function hide(){overlay.classList.add('hidden')}function finish(win){state=win?'win':'over';sound(win?880:160,.35,'sawtooth');show(win?'🏆 궁전 탈출 성공!':'💀 모험 종료',win?`축하합니다! 모든 스테이지를 통과했습니다.<br>최종 점수: ${score.toLocaleString()}점`:`최종 점수: ${score.toLocaleString()}점<br>다시 도전해 보세요!`,'다시 시작')}
function press(code){keys.add(code);if(code==='KeyP'){togglePause();return}if(code==='KeyR'){restart();return}if(state!=='playing')return;if((code==='Space'||code==='ArrowUp'||code==='KeyZ')&&player.onGround){player.vy=-12.5;player.onGround=false;sound(360,.11)}if(code==='KeyX'&&player.attack<=0){player.attack=15;player.attackTag=++attackId;sound(540,.07)}}function togglePause(){if(state==='playing'){state='paused';show('⏸ 일시정지','계속하려면 P 키나 아래 버튼을 누르세요.','계속하기')}else if(state==='paused'){state='playing';hide()}}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyX','KeyZ','KeyP','KeyR'].includes(e.code)){e.preventDefault();if(!e.repeat)press(e.code);else keys.add(e.code)}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(k)});for(const a of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(a,()=>keys.delete(k))});document.getElementById('pause').onclick=togglePause;startButton.onclick=()=>{if(state==='paused'){togglePause()}else restart()};
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function platformsAt(x){return world.platforms.filter(([a,w])=>x+player.w>a&&x<a+w)}
function physics(e){let oldY=e.y;e.vy=Math.min(15,e.vy+.62);e.x+=e.vx;e.y+=e.vy;e.onGround=false;if(e.y+e.h>=oldY+e.h){for(const [x,w,y] of world.platforms){if(e.x+e.w>x+4&&e.x<x+w-4&&oldY+e.h<=y+8&&e.y+e.h>=y&&e.vy>=0){e.y=y-e.h;e.vy=0;e.onGround=true;break}}}e.x=Math.max(0,Math.min(world.width-e.w,e.x))}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*6,life:25+Math.random()*18,color})}
function hurt(n=1){if(player.inv>0)return;player.hp-=n;player.inv=60;player.vy=-6;player.vx=-player.dir*5;burst(player.x+15,player.y+20,'#f45d5d');sound(150,.18,'sawtooth');if(player.hp<=0)finish(false)}
function update(){tick++;if(state!=='playing')return;clockAcc++;if(clockAcc>=60){clockAcc=0;timeLeft--;if(timeLeft<=0){finish(false);return}}if(player.inv>0)player.inv--;if(player.attack>0)player.attack--;player.block=keys.has('ArrowDown')&&player.onGround;let move=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);if(move){player.dir=move;player.vx=move*(player.block?1.1:3.5)}else player.vx*=.73;physics(player);
if(player.y>H+90){hurt(1);if(state!=='playing')return;player.x=Math.max(40,player.x-100);player.y=100;player.vy=0;player.inv=85}
for(const [x1,x2] of world.spikes){if(player.x+player.w-5>x1&&player.x+5<x2&&player.y+player.h>=GR-13&&player.y+player.h<=GR+17){hurt();break}}
for(let c of world.coins){if(!c.taken&&Math.abs(player.x+15-c.x)<25&&Math.abs(player.y+23-c.y)<38){c.taken=true;score+=100;burst(c.x,c.y,'#ffe269',9);sound(700,.09,'sine')}}
for(let g of world.guards){if(!g.alive)continue;if(g.hit>0)g.hit--;if(g.atk>0)g.atk--;let distance=player.x-g.x;const sees=Math.abs(distance)<260&&Math.abs(player.y-g.y)<75;let walk=sees?(distance>0?1:-1):Math.sin(tick/95+g.patrol)*1;g.dir=walk>=0?1:-1;g.vx=sees&&Math.abs(distance)<48?0:walk*1.08;
let nextX=g.x+g.vx,hasFloor=world.platforms.some(([x,w,y])=>nextX+g.w/2>=x&&nextX+g.w/2<=x+w&&Math.abs(g.y+g.h-y)<7);if(!hasFloor&&g.onGround)g.vx=0;physics(g);
if(player.attack>4&&player.attack<13&&player.attackTag!==g.attackTag&&Math.abs((player.x+player.w/2)-(g.x+g.w/2))<70&&Math.abs(player.y-g.y)<53&&((g.x>player.x)=== (player.dir>0))){g.attackTag=player.attackTag;g.hp--;g.hit=12;g.vx=player.dir*4;burst(g.x+15,g.y+22,'#ffdb88');sound(240,.07);if(g.hp<=0){g.alive=false;score+=250;burst(g.x+13,g.y+25,'#d1a4ff',18)}}
if(sees&&Math.abs(distance)<45&&g.atk<=0){g.atk=70;if(!(player.block&&((g.x>player.x)===(player.dir>0))))hurt(1);else{sound(500,.1,'triangle');burst(player.x+15,player.y+18,'#aacfff',5)}}}
if(player.x>world.door-10&&player.y+player.h>=GR-55){score+=500;sound(900,.2);if(level===layouts.length-1){finish(true)}else {loadLevel(level+1)}}cam+=(Math.max(0,Math.min(world.width-W,player.x-W*.35))-cam)*.12;particles=particles.filter(p=>p.life-->0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.2}}
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function palace(){let gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#1b203d');gradient.addColorStop(1,'#7d4b49');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d9b47f';ctx.beginPath();ctx.arc(785,105,37,0,Math.PI*2);ctx.fill();for(let i=0;i<16;i++){let x=i*85-(cam*.24%85);box(x,212,55,250,'#57415b');ctx.fillStyle='#29253f';ctx.beginPath();ctx.arc(x+27,212,27,Math.PI,0);ctx.fill();box(x+8,215,39,190,'#29253f')}for(let i=0;i<13;i++){let x=i*110-(cam*.52%110);box(x,305,23,165,'#8b6162');box(x-10,294,43,12,'#bb8270');box(x-9,445,42,16,'#6e4d51')}}
function character(e,hero){if(e.inv>0&&tick%6<3)return;const x=Math.round(e.x),y=Math.round(e.y);ctx.save();ctx.translate(x+e.w/2,y);ctx.scale(e.dir,1);ctx.translate(-e.w/2,0);box(5,0,18,17,hero?'#e9bc87':'#b67659');box(3,0,22,6,hero?'#25263f':'#842f31');box(7,7,4,3,'#282128');box(6,17,17,19,hero?'#e8e3d6':'#c0443c');box(6,35,7,19,'#403f5b');box(17,35,7,19,'#403f5b');box(3,20,5,19,hero?'#e9bc87':'#b67659');box(21,20,5,19,hero?'#e9bc87':'#b67659');box(4,32,23,4,hero?'#8b6539':'#292424');if(hero&&e.block){box(22,13,13,27,'#9caecc');box(25,15,7,20,'#6689ae')}else if(hero&&e.attack>3&&e.attack<14){box(24,-8,4,42,'#e3eef7');box(22,24,10,4,'#d9aa52')}else if(!hero&&e.atk>50){box(25,4,3,35,'#c1cedb')}ctx.restore()}
function draw(){palace();ctx.save();ctx.translate(-Math.round(cam),0);
for(let [x,w,y] of world.platforms){box(x,y,w,22,'#ad825c');box(x,y,w,6,'#e4bd81');for(let j=x;j<x+w;j+=48){box(j+2,y+25,46,H-y-20,'#80604d');box(j+3,y+36,40,2,'#695044')}}for(let [x1,x2] of world.spikes){for(let x=x1;x<x2;x+=17){ctx.fillStyle='#d9dae0';ctx.beginPath();ctx.moveTo(x,GR);ctx.lineTo(x+8,GR-25);ctx.lineTo(x+16,GR);ctx.fill()}}for(let c of world.coins){if(!c.taken){ctx.fillStyle='#ffd85b';ctx.beginPath();ctx.arc(c.x,c.y+Math.sin(tick*.08+c.x)*4,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff4aa';ctx.lineWidth=2;ctx.stroke()}}
box(world.door,GR-105,56,105,'#502d46');box(world.door+8,GR-97,40,97,'#d8a24d');ctx.fillStyle='#4b2840';ctx.beginPath();ctx.arc(world.door+28,GR-95,20,Math.PI,0);ctx.fill();box(world.door+13,GR-45,8,8,'#fae9aa');for(let g of world.guards)if(g.alive)character(g,false);character(player,true);for(let p of particles)box(p.x,p.y,5,5,p.color);ctx.restore();box(0,0,W,53,'#100e1edb');ctx.font='bold 20px system-ui';ctx.fillStyle='#ffe4a6';ctx.fillText('⚔ 사막 궁전',18,34);ctx.fillStyle='#f7e3d1';ctx.font='18px system-ui';ctx.fillText(`스테이지 ${level+1}/3`,220,33);ctx.fillText(`점수 ${score}`,407,33);ctx.fillText(`⏱ ${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}`,605,33);ctx.fillStyle='#fb6676';ctx.fillText('♥'.repeat(Math.max(0,player?.hp||0)),765,33)}
function loop(t){if(!last)last=t;let frames=Math.min(3,Math.max(1,Math.round((t-last)/16.666)));last=t;for(let i=0;i<frames;i++)update();if(world&&player)draw();else{palace();ctx.fillStyle='#ffe09d';ctx.font='bold 28px system-ui';ctx.fillText('사막 궁전의 모험',350,260)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
